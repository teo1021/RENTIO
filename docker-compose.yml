services:
  ai-service:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    env_file:
      - ./ai_service/.env
    environment:
      DATA_DIR: /app/data
    ports:
      - "5001:5001"
    volumes:
      - ./backend/data/market:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: host.docker.internal
      AI_SERVICE_URL: http://ai-service:5001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"
    depends_on:
      ai-service:
        condition: service_healthy
